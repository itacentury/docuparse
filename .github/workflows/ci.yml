name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check docuparse/

      - name: Ruff format check
        run: uv run ruff format --check docuparse/

      - name: Mypy
        run: uv run mypy docuparse/

      - name: Pytest
        run: |
          set +e
          uv run pytest
          rc=$?
          if [ $rc -eq 0 ] || [ $rc -eq 5 ]; then exit 0; else exit $rc; fi
